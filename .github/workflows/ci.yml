name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }} / ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: RustCommander-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: RustCommander-macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: RustCommander-windows-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Clippy (non-blocking)
        run: cargo clippy --target ${{ matrix.target }} --all-targets
        continue-on-error: true

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Generate macOS icon (ICNS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p AppIcon.iconset
          for s in 16 32 128 256 512; do
            d=$((s * 2))
            sips -s format png -z $s $s resources/icon.png --out "AppIcon.iconset/icon_${s}x${s}.png"
            sips -s format png -z $d $d resources/icon.png --out "AppIcon.iconset/icon_${s}x${s}@2x.png"
          done
          iconutil -c icns AppIcon.iconset -o AppIcon.icns

      - name: Package (macOS .app bundle)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP_NAME="Rust Commander"
          mkdir -p "dist/${APP_NAME}.app/Contents/MacOS" "dist/${APP_NAME}.app/Contents/Resources"
          cp resources/Info.plist "dist/${APP_NAME}.app/Contents/Info.plist"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${VERSION}" "dist/${APP_NAME}.app/Contents/Info.plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION}" "dist/${APP_NAME}.app/Contents/Info.plist"
          fi
          cp AppIcon.icns "dist/${APP_NAME}.app/Contents/Resources/AppIcon.icns"
          cp "target/${{ matrix.target }}/release/rust-commander" "dist/${APP_NAME}.app/Contents/MacOS/rust-commander"
          chmod +x "dist/${APP_NAME}.app/Contents/MacOS/rust-commander"
          # Ad-hoc sign the bundle. Gatekeeper rejects quarantined apps whose
          # signature is missing or inconsistent as "damaged" with no bypass;
          # an ad-hoc signature downgrades that to "unidentified developer",
          # which users can open via right-click > Open (or Privacy settings).
          codesign --force --deep --sign - "dist/${APP_NAME}.app"
          codesign --verify --deep "dist/${APP_NAME}.app"
          cd dist
          # ditto (not zip) so the archive preserves signature metadata and permissions
          ditto -c -k --sequesterRsrc --keepParent "${APP_NAME}.app" "${{ matrix.artifact }}.zip"
          cd ..

      - name: Package (Windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/rust-commander.exe" -DestinationPath "dist/${{ matrix.artifact }}.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
