name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }} / ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: RustCommander-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: RustCommander-macos-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: RustCommander-windows-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Clippy (non-blocking)
        run: cargo clippy --target ${{ matrix.target }} --all-targets
        continue-on-error: true

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}

      # Headless UI and unit tests, on each OS the app is built for.
      - name: Test
        run: cargo test

      - name: Generate macOS icon (ICNS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          mkdir -p AppIcon.iconset
          for s in 16 32 128 256 512; do
            d=$((s * 2))
            sips -s format png -z $s $s resources/icon.png --out "AppIcon.iconset/icon_${s}x${s}.png"
            sips -s format png -z $d $d resources/icon.png --out "AppIcon.iconset/icon_${s}x${s}@2x.png"
          done
          iconutil -c icns AppIcon.iconset -o AppIcon.icns

      - name: Package (macOS .app bundle)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP_NAME="Rust Commander"
          mkdir -p "dist/${APP_NAME}.app/Contents/MacOS" "dist/${APP_NAME}.app/Contents/Resources"
          cp resources/Info.plist "dist/${APP_NAME}.app/Contents/Info.plist"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${VERSION}" "dist/${APP_NAME}.app/Contents/Info.plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION}" "dist/${APP_NAME}.app/Contents/Info.plist"
          fi
          cp AppIcon.icns "dist/${APP_NAME}.app/Contents/Resources/AppIcon.icns"
          cp "target/${{ matrix.target }}/release/rust-commander" "dist/${APP_NAME}.app/Contents/MacOS/rust-commander"
          chmod +x "dist/${APP_NAME}.app/Contents/MacOS/rust-commander"
          # Ad-hoc sign the bundle. Gatekeeper rejects quarantined apps whose
          # signature is missing or inconsistent as "damaged" with no bypass;
          # an ad-hoc signature downgrades that to "unidentified developer",
          # which users can open via right-click > Open (or Privacy settings).
          codesign --force --deep --sign - "dist/${APP_NAME}.app"
          codesign --verify --deep "dist/${APP_NAME}.app"
          cd dist
          # ditto (not zip) so the archive preserves signature metadata and permissions
          ditto -c -k --sequesterRsrc --keepParent "${APP_NAME}.app" "${{ matrix.artifact }}.zip"
          cd ..

      - name: Package (Windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "target/${{ matrix.target }}/release/rust-commander.exe" -DestinationPath "dist/${{ matrix.artifact }}.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Fetch this run's build archives
        run: |
          mkdir -p dist
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir dist --pattern 'RustCommander-*'
          # Each artifact lands in a folder of its own; keep the archives.
          find dist -mindepth 2 -name '*.zip' -exec mv {} dist/ \;
          find dist -mindepth 1 -type d -empty -delete
          ls -la dist
          test "$(find dist -name '*.zip' | wc -l)" -eq 3

      - name: Attach the archives to the release, then check all three are there
        run: |
          # Uploading once stopped half-way (v0.1.4 was published with two of
          # its three files), so it is retried and the result is checked.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
                 --title "$TAG" --generate-notes
          uploaded=false
          for attempt in 1 2 3 4 5; do
            if gh release upload "$TAG" dist/*.zip --repo "$GITHUB_REPOSITORY" --clobber; then
              uploaded=true
              break
            fi
            echo "Upload attempt $attempt failed; retrying in 15 s"
            sleep 15
          done
          if [ "$uploaded" != true ]; then
            echo "Uploading the archives kept failing"
            exit 1
          fi
          count=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')
          echo "Files on the release: $count"
          test "$count" -eq 3
