[package]
name = "rust-commander"
version = "0.1.6"
edition = "2021"
description = "Total Commander-style dual-pane file manager with a utility toolbox, written in pure Rust. Works on Windows and macOS."
license = "MIT"
repository = "https://github.com/CJ-1981/rust-commander"
readme = "README.md"
keywords = ["file-manager", "dual-pane", "commander", "gui", "egui"]
categories = ["gui", "filesystem"]

[dependencies]
eframe = { version = "0.30", features = ["persistence"] }
egui_extras = "0.30"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
md-5 = "0.10"
open = "5"
chrono = "0.4"
sysinfo = "0.31"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
codegen-units = 1
